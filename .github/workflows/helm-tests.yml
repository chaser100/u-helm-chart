name: Helm Tests

on:
  push:
    branches: [main]
    paths:
      - "helm-charts/application/**"
      - ".github/workflows/helm-tests.yml"
  pull_request:
    paths:
      - "helm-charts/application/**"
      - ".github/workflows/helm-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: helm-charts/application

jobs:
  helm-tests:
    name: Lint and template tested examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.18.4

      - name: Lint chart defaults
        shell: bash
        run: |
          set -euo pipefail
          helm lint "$CHART_PATH" --strict

          if helm template test "$CHART_PATH" | grep -q '^kind: ServiceMonitor$'; then
            echo "ServiceMonitor must not render with default values" >&2
            exit 1
          fi

      - name: Lint and template tested examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          values_files=("$CHART_PATH"/tests/*.yaml)
          if (( ${#values_files[@]} == 0 )); then
            echo "No tested values files found in $CHART_PATH/tests" >&2
            exit 1
          fi

          for values_file in "${values_files[@]}"; do
            echo "::group::Validating $values_file"
            helm lint "$CHART_PATH" --strict --values "$values_file"
            helm template test "$CHART_PATH" --values "$values_file" >/dev/null
            echo "::endgroup::"
          done

          echo "Validated ${#values_files[@]} tested examples"

          advanced_route="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-route-advanced.yaml" \
            --show-only templates/route.yaml)"

          for expected_value in \
            "value: /health" \
            "value: /api" \
            "type: RequestHeaderModifier"; do
            if ! grep -Fq "$expected_value" <<<"$advanced_route"; then
              echo "Advanced HTTPRoute output is missing: $expected_value" >&2
              exit 1
            fi
          done

          ingress_plain_services="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-ingress-plain.yaml" \
            --show-only templates/ingress-plain-services.yaml)"

          if ! grep -Fq "appProtocol: grpc" <<<"$ingress_plain_services"; then
            echo "Plain Ingress Service output is missing appProtocol" >&2
            exit 1
          fi

          main_service="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-service-app-protocol.yaml" \
            --show-only templates/7_service.yaml)"

          if ! grep -Fq "appProtocol: grpc" <<<"$main_service"; then
            echo "Chart-managed Service output is missing appProtocol" >&2
            exit 1
          fi

          default_service="$(helm template test "$CHART_PATH" \
            --show-only templates/7_service.yaml)"

          if grep -Fq "appProtocol:" <<<"$default_service"; then
            echo "Chart-managed Service must omit appProtocol by default" >&2
            exit 1
          fi

          extra_manifests="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-extra-manifests.yaml" \
            --show-only templates/1_extra-manifests.yaml)"

          if ! grep -Fq 'argocd.argoproj.io/sync-wave: "-5"' <<<"$extra_manifests"; then
            echo "ExternalSecret output is missing the user-defined Argo CD sync wave" >&2
            exit 1
          fi

          if grep -Fq "helm.sh/hook" <<<"$extra_manifests"; then
            echo "ExternalSecret must not receive Helm hooks by default" >&2
            exit 1
          fi

          hooked_external_secret="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-external-secret-hooks.yaml" \
            --show-only templates/1_extra-manifests.yaml)"

          for hook_annotation in \
            "helm.sh/hook: pre-install,pre-upgrade" \
            'helm.sh/hook-weight: "-5"' \
            "helm.sh/hook-delete-policy: before-hook-creation"; do
            if ! grep -Fq "$hook_annotation" <<<"$hooked_external_secret"; then
              echo "Opt-in ExternalSecret hook output is missing: $hook_annotation" >&2
              exit 1
            fi
          done

          multi_port_deployment="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-multi-port.yaml" \
            --show-only templates/5_deployment.yaml)"

          for deployment_value in \
            "revisionHistoryLimit: 2" \
            "- --config=/etc/application/config.yaml" \
            "containerPort: 8080" \
            "containerPort: 8081"; do
            if ! grep -Fq -- "$deployment_value" <<<"$multi_port_deployment"; then
              echo "Multi-port Deployment output is missing: $deployment_value" >&2
              exit 1
            fi
          done

          multi_port_service="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-multi-port.yaml" \
            --show-only templates/7_service.yaml)"

          if [[ "$(grep -c '^      port:' <<<"$multi_port_service")" -ne 2 ]]; then
            echo "Multi-port Service must contain exactly two ports" >&2
            exit 1
          fi

          legacy_udp_service="$(helm template test "$CHART_PATH" \
            --set service.protocol=UDP \
            --show-only templates/7_service.yaml)"

          if ! grep -Fq "protocol: UDP" <<<"$legacy_udp_service"; then
            echo "Legacy Service output does not honor service.protocol" >&2
            exit 1
          fi

          service_disabled="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-service-disabled.yaml")"

          if ! grep -q '^kind: Deployment$' <<<"$service_disabled"; then
            echo "Deployment must render when service.enabled=false" >&2
            exit 1
          fi

          if grep -q '^kind: Service$' <<<"$service_disabled"; then
            echo "Service must not render when service.enabled=false" >&2
            exit 1
          fi

          existing_service_account="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-service-account-disabled.yaml")"

          if grep -q '^kind: ServiceAccount$' <<<"$existing_service_account"; then
            echo "ServiceAccount must not render when serviceAccount.create=false" >&2
            exit 1
          fi

          if ! grep -Fq "serviceAccountName: existing-service-account" <<<"$existing_service_account"; then
            echo "Deployment does not reference the configured existing ServiceAccount" >&2
            exit 1
          fi

          implicit_default_service_account="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-service-account-implicit-default.yaml")"

          if grep -q '^kind: ServiceAccount$' <<<"$implicit_default_service_account"; then
            echo "Default ServiceAccount must not render when serviceAccount.create=false" >&2
            exit 1
          fi

          if grep -q '^[[:space:]]*serviceAccountName:' <<<"$implicit_default_service_account"; then
            echo "Deployment must omit serviceAccountName when no existing account is configured" >&2
            exit 1
          fi

          job_without_service_account="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-job.yaml" \
            --set deploymentDisable=true \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name= \
            --set-string job.serviceAccountName= \
            --show-only templates/3_job.yaml)"

          if grep -q '^[[:space:]]*serviceAccountName:' <<<"$job_without_service_account"; then
            echo "Job must omit serviceAccountName when no existing account is configured" >&2
            exit 1
          fi

          cronjob_without_service_account="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-cronjob.yaml" \
            --set deploymentDisable=true \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name= \
            --show-only templates/11_cronjob.yaml)"

          if grep -q '^[[:space:]]*serviceAccountName:' <<<"$cronjob_without_service_account"; then
            echo "CronJob must omit serviceAccountName when no existing account is configured" >&2
            exit 1
          fi

          extra_ingress="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-ingress-extra.yaml" \
            --show-only templates/9_ingress-extra.yaml)"

          for ingress_value in \
            "name: test-extra" \
            "ingressClassName: nginx-internal" \
            'host: "admin.example.com"' \
            "secretName: admin-example-tls" \
            "number: 8080"; do
            if ! grep -Fq "$ingress_value" <<<"$extra_ingress"; then
              echo "Extra Ingress output is missing: $ingress_value" >&2
              exit 1
            fi
          done
