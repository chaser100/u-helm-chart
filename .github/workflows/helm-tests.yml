name: Helm Tests

on:
  push:
    branches: [main]
    paths:
      - "helm-charts/application/**"
      - ".github/workflows/helm-tests.yml"
  pull_request:
    paths:
      - "helm-charts/application/**"
      - ".github/workflows/helm-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: helm-charts/application

jobs:
  helm-tests:
    name: Lint and template tested examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.18.4

      - name: Lint chart defaults
        shell: bash
        run: |
          set -euo pipefail
          helm lint "$CHART_PATH" --strict

          if helm template test "$CHART_PATH" | grep -q '^kind: ServiceMonitor$'; then
            echo "ServiceMonitor must not render with default values" >&2
            exit 1
          fi

      - name: Lint and template tested examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          values_files=("$CHART_PATH"/tests/*.yaml)
          if (( ${#values_files[@]} == 0 )); then
            echo "No tested values files found in $CHART_PATH/tests" >&2
            exit 1
          fi

          for values_file in "${values_files[@]}"; do
            echo "::group::Validating $values_file"
            helm lint "$CHART_PATH" --strict --values "$values_file"
            helm template test "$CHART_PATH" --values "$values_file" >/dev/null
            echo "::endgroup::"
          done

          echo "Validated ${#values_files[@]} tested examples"

          advanced_route="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-route-advanced.yaml" \
            --show-only templates/route.yaml)"

          for expected_value in \
            "value: /health" \
            "value: /api" \
            "type: RequestHeaderModifier"; do
            if ! grep -Fq "$expected_value" <<<"$advanced_route"; then
              echo "Advanced HTTPRoute output is missing: $expected_value" >&2
              exit 1
            fi
          done

          ingress_plain_services="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-ingress-plain.yaml" \
            --show-only templates/ingress-plain-services.yaml)"

          if ! grep -Fq "appProtocol: grpc" <<<"$ingress_plain_services"; then
            echo "Plain Ingress Service output is missing appProtocol" >&2
            exit 1
          fi

          main_service="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-service-app-protocol.yaml" \
            --show-only templates/7_service.yaml)"

          if ! grep -Fq "appProtocol: grpc" <<<"$main_service"; then
            echo "Chart-managed Service output is missing appProtocol" >&2
            exit 1
          fi

          default_service="$(helm template test "$CHART_PATH" \
            --show-only templates/7_service.yaml)"

          if grep -Fq "appProtocol:" <<<"$default_service"; then
            echo "Chart-managed Service must omit appProtocol by default" >&2
            exit 1
          fi

          extra_manifests="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-extra-manifests.yaml" \
            --show-only templates/1_extra-manifests.yaml)"

          if ! grep -Fq 'argocd.argoproj.io/sync-wave: "-5"' <<<"$extra_manifests"; then
            echo "ExternalSecret output is missing the user-defined Argo CD sync wave" >&2
            exit 1
          fi

          if grep -Fq "helm.sh/hook" <<<"$extra_manifests"; then
            echo "ExternalSecret must not receive Helm hooks by default" >&2
            exit 1
          fi

          hooked_external_secret="$(helm template test "$CHART_PATH" \
            --values "$CHART_PATH/tests/values-test-external-secret-hooks.yaml" \
            --show-only templates/1_extra-manifests.yaml)"

          for hook_annotation in \
            "helm.sh/hook: pre-install,pre-upgrade" \
            'helm.sh/hook-weight: "-5"' \
            "helm.sh/hook-delete-policy: before-hook-creation"; do
            if ! grep -Fq "$hook_annotation" <<<"$hooked_external_secret"; then
              echo "Opt-in ExternalSecret hook output is missing: $hook_annotation" >&2
              exit 1
            fi
          done
