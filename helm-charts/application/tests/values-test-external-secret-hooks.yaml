# Test opt-in legacy Helm hooks for ExternalSecret resources
image: nginx
imageTag: 1.27
externalSecretHooks:
  enabled: true
extraManifests:
  - apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: hooked-external-secret
    spec:
      refreshInterval: 10s
      secretStoreRef:
        name: vault-cluster-backend
        kind: ClusterSecretStore
      target:
        name: hooked-external-secret
