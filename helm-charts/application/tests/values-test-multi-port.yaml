# Test main container args, revision history, and multiple container and Service ports
image: nginx
imageTag: 1.27
args:
  - --config=/etc/application/config.yaml
revisionHistoryLimit: 2
containerPorts:
  - name: metrics
    containerPort: 8080
    protocol: TCP
  - name: health
    containerPort: 8081
    protocol: TCP
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
      appProtocol: http
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
readinessProbe:
  httpGet:
    path: /ready
    port: health
livenessProbe:
  httpGet:
    path: /health
    port: health
